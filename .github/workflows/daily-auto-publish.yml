name: 매일 7시 뉴스 자동 발행

on:
  schedule:
    # 매일 오전 7시 KST (= UTC 전날 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '실행 기준일 (YYYY-MM-DD, 기본값: 오늘 KST)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────────
  # Job 1: 주식 뉴스 브리핑 (RSS 수집 → 영향도 평가 → 카드 작성 → 웹 발행)
  # ────────────────────────────────────────────
  stock-briefing:
    name: 📈 주식 뉴스 브리핑
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      today: ${{ steps.date.outputs.today }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set today (KST)
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "today=${{ github.event.inputs.target_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "today=$(TZ=Asia/Seoul date '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run stock pipeline via Claude CLI
        run: |
          TODAY=${{ steps.date.outputs.today }}
          npx -y @anthropic-ai/claude-code@latest \
            --dangerously-skip-permissions \
            -p "
          오늘 날짜: $TODAY
          프로젝트 루트: ${{ github.workspace }}

          주식 뉴스 브리핑 전체 파이프라인을 실행해줘.
          에이전트 정의: ${{ github.workspace }}/stock-service/.claude/agents/

          실행 순서 (순차 — 각 단계 완료 후 다음 진행):

          1. rss-collector 에이전트:
             - stock-service/.claude/agents/rss-collector.md 읽기
             - RSS 15개 피드에서 오늘($TODAY) 기사 수집
             - 저장: ${{ github.workspace }}/stock-service/_pipeline/stock-01-rss-pool.md (덮어쓰기 OK)

          2. stock-impact-scorer 에이전트:
             - stock-service/.claude/agents/stock-impact-scorer.md 읽기
             - stock-01-rss-pool.md 읽기 → 영향도 7점+ 선별
             - 저장: ${{ github.workspace }}/stock-service/_pipeline/stock-02-scored.md

          3. news-script-writer 에이전트:
             - stock-service/.claude/agents/news-script-writer.md 읽기
             - stock-02-scored.md 읽기 → 카드뉴스 스타일로 전체 선별 기사 작성
             - 저장 (두 경로 동일 내용):
               - ${{ github.workspace }}/stock-service/_stock-news/$TODAY-stock-brief.md
               - ${{ github.workspace }}/web/stock-briefs/$TODAY-stock-brief.md

          4. stock-publisher 에이전트:
             - stock-service/.claude/agents/stock-publisher.md 읽기
             - web/stock-briefs.json에 $TODAY 항목 추가 또는 업데이트

          선별 기사 0건이면 빈 파일 생성 없이 종료.
          "
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push
        run: |
          TODAY=${{ steps.date.outputs.today }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "auto: $TODAY 주식 뉴스 브리핑 자동 발행"
            git push
          fi

  # ────────────────────────────────────────────
  # Job 2: 카드뉴스 발행 (기사 수집 → 리서치+집필 → 웹 발행)
  # stock-briefing 완료 후 실행 (git 충돌 방지) — 실패해도 항상 실행
  # ────────────────────────────────────────────
  card-news:
    name: 📰 카드뉴스 자동 발행
    runs-on: ubuntu-latest
    needs: stock-briefing
    if: always()
    timeout-minutes: 90
    outputs:
      today: ${{ steps.date.outputs.today }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set today (KST)
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "today=${{ github.event.inputs.target_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "today=$(TZ=Asia/Seoul date '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull latest (stock-briefing 커밋 포함)
        run: git pull origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run card news pipeline via Claude CLI
        run: |
          TODAY=${{ steps.date.outputs.today }}
          npx -y @anthropic-ai/claude-code@latest \
            --dangerously-skip-permissions \
            -p "
          오늘 날짜: $TODAY
          프로젝트 루트: ${{ github.workspace }}

          시나리오 B 카드뉴스 전체 파이프라인을 실행해줘.
          에이전트 정의: ${{ github.workspace }}/.claude/agents/

          news-orchestrator 에이전트(${{ github.workspace }}/.claude/agents/news-orchestrator.md)를 사용해서 실행:

          1. news-collector-lite 에이전트:
             - MIT Technology Review + Heisenberg 최신 기사 수집
             - _pipeline/01-hot-news-pool.md 저장

          2. researcher-writer 에이전트 × 4 (자동 선정):
             - 수집된 기사 중 파급력 점수 높은 순 최대 4건 선정
             - 각 기사: 원문 fetch → 한국어 아티클 작성 → _posts/ + web/posts/ 저장
             - 이미 _posts/에 동일 파일명 존재하면 건너뜀 (중복 방지)

          3. publisher 에이전트:
             - web/posts.json에 새 아티클 메타데이터 추가

          수집 기사 0건이면 종료.
          "
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push
        run: |
          TODAY=${{ steps.date.outputs.today }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main
          git add -A
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "auto: $TODAY 카드뉴스 자동 발행"
            git push
          fi

  # ────────────────────────────────────────────
  # Job 3: 발행 완료 이메일 알림
  # card-news 완료(성공·실패 무관) 후 항상 실행
  # ────────────────────────────────────────────
  notify:
    name: 📧 발행 완료 알림 메일
    runs-on: ubuntu-latest
    needs: [stock-briefing, card-news]
    if: always()

    steps:
      - name: 발행 결과 이메일 전송
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[한입뉴스] ${{ needs.card-news.outputs.today }} 자동 발행 완료"
          to: byungkyu.lee@sk.com
          from: 병규의 한입뉴스 <${{ secrets.MAIL_USERNAME }}>
          html_body: |
            <div style="font-family: -apple-system, sans-serif; max-width: 600px; margin: 0 auto; padding: 24px; color: #111;">
              <h2 style="margin: 0 0 4px; font-size: 20px;">📰 병규의 한입뉴스</h2>
              <p style="margin: 0 0 24px; color: #6B7280; font-size: 14px;">${{ needs.card-news.outputs.today }} 자동 발행 결과</p>

              <table style="width:100%; border-collapse:collapse; margin-bottom:24px;">
                <tr style="background:#F9FAFB;">
                  <td style="padding:12px 16px; font-weight:600; border:1px solid #E5E7EB;">📈 주식 뉴스 브리핑</td>
                  <td style="padding:12px 16px; border:1px solid #E5E7EB;">
                    ${{ needs.stock-briefing.result == 'success' && '✅ 발행 완료' || needs.stock-briefing.result == 'skipped' && '⏭️ 건너뜀' || '❌ 실패' }}
                  </td>
                </tr>
                <tr>
                  <td style="padding:12px 16px; font-weight:600; border:1px solid #E5E7EB;">📰 카드뉴스</td>
                  <td style="padding:12px 16px; border:1px solid #E5E7EB;">
                    ${{ needs.card-news.result == 'success' && '✅ 발행 완료' || needs.card-news.result == 'skipped' && '⏭️ 건너뜀' || '❌ 실패' }}
                  </td>
                </tr>
              </table>

              <a href="https://jiseungchan.github.io/one_bite_news_project/"
                 style="display:inline-block; padding:12px 24px; background:#0F766E; color:#fff; text-decoration:none; border-radius:8px; font-weight:600;">
                사이트 바로가기 →
              </a>

              <p style="margin-top:24px; color:#9CA3AF; font-size:12px;">
                이 메일은 GitHub Actions에 의해 자동 발송됩니다.<br>
                문의: GitHub Actions 워크플로우 로그를 확인하세요.
              </p>
            </div>
